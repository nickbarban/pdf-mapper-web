# Deploy to AWS EC2 (free tier) on push to main
name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual run

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          install -m 600 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/deploy_key 2>/dev/null || echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy files to EC2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ec2-user/pdf-mapper-web' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new" \
            --exclude=.git \
            --exclude=frontend/node_modules \
            --exclude=backend/build \
            --exclude=backend/.gradle \
            --exclude=data \
            ./ $EC2_USER@${{ secrets.EC2_HOST }}:$DEPLOY_PATH/

      - name: Deploy on EC2
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/home/ec2-user/pdf-mapper-web' }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            $EC2_USER@${{ secrets.EC2_HOST }} \
            "cd $DEPLOY_PATH && docker compose -f docker-compose.prod.yml build --no-cache && docker compose -f docker-compose.prod.yml up -d"

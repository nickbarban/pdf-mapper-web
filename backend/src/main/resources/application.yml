server:
  port: 5171

app:
  dataDir: ${DATA_DIR:./data}
  # Optional: comma-separated resource locations for frontend static files (e.g. file:/app/static/)
  staticLocations: ${STATIC_LOCATIONS:classpath:/static/}

spring:
  jackson:
    serialization:
      INDENT_OUTPUT: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
